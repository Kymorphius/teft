name: Teft source checks

on:
  push:
    branches: [main, system/main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  branding:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Check permission and UI branding
        run: python3 tests/test_teft_stage_branding.py
      - name: Check development launcher syntax
        run: bash -n tools/teft.sh
